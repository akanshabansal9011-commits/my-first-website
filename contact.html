<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contact All About Worksheets for questions, suggestions and worksheet requests.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://allaboutworksheets.com/contact.html">
  <title>Contact Us | All About Worksheets</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero"><div class="container"><span class="eyebrow">SAY HELLO</span><h1>We would love to hear from you</h1><p>Questions, ideas or worksheet requests are welcome.</p></div></section>
    <section class="section"><div class="container narrow">
      <form class="contact-form" id="contact-form">
        <div class="row g-3">
          <div class="col-md-6"><label for="name">Name</label><input id="name" required autocomplete="name"></div>
          <div class="col-md-6"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
          <div class="col-12"><label for="message">Message</label><textarea id="message" rows="6" required></textarea></div>
          <div class="col-12"><button class="btn btn-primary btn-lg" type="submit">Send message <i class="bi bi-send"></i></button><p class="form-success mt-3">This opens your email app and sends to hello@allaboutworksheets.com.</p></div>
        </div>
      </form>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <button id="back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
