<!doctype html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K3VXDX4ZXD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K3VXDX4ZXD');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse printable worksheets by class, subject and level. Download ready-to-print worksheet PDFs.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://allaboutworksheets.com/worksheets.html">
  <title>Browse Worksheets | All About Worksheets</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container"><span class="eyebrow">RESOURCE LIBRARY</span><h1>Worksheets made for curious minds</h1><p>Filter and download a joyful learning activity.</p></div>
    </section>
    <section class="section" id="worksheet-results">
      <div class="container">
        <div class="catalogue-controls">
          <div class="control-section">
            <p class="control-label">Filters</p>
            <div class="filter-group">
              <select id="class-filter" aria-label="Filter by class"><option value="">All classes</option></select>
              <select id="subject-filter" aria-label="Filter by subject"><option value="">All subjects</option></select>
              <select id="level-filter" aria-label="Filter by level"><option value="">All levels</option></select>
            </div>
          </div>
          <div class="control-section sort-section">
            <p class="control-label">Sort by</p>
            <select id="sort" aria-label="Sort worksheets"><option value="newest">Newest</option><option value="alphabetical">A-Z</option></select>
          </div>
        </div>
        <p id="result-count" class="result-count" aria-live="polite"></p>
        <div class="worksheet-grid" id="worksheets-grid"><div class="loading"><div class="spinner-border" role="status"></div><span>Loading worksheets...</span></div></div>
        <div id="empty-state" class="empty-state d-none"><div><i class="bi bi-search"></i></div><h2>No worksheets found.</h2><p>Try a different selection or clear the filters.</p><button id="clear-filters" class="btn btn-primary">Clear Filters</button></div>
        <nav id="pagination" class="pagination-wrap" aria-label="Worksheet pages"></nav>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <button id="back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/worksheets.js"></script>
</body>
</html>
